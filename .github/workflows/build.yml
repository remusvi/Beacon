name: Build & Package Binaries

on:
  push:
    branches: [ "main", "clean-up", "p2p-multiplayer" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macOS (Apple Silicon arm64)
            artifact-name: Beacon-macos-arm64
            target: macos
          - os: macos-13
            os-name: macOS (Intel x86_64)
            artifact-name: Beacon-macos-x86_64
            target: macos
          - os: windows-latest
            os-name: Windows (x64)
            artifact-name: Beacon-windows-x64
            target: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: interface2/package-lock.json

      - name: Install Frontend Dependencies & Build UI
        working-directory: interface2
        run: |
          npm install
          npm run build

      - name: Install macOS Dependencies
        if: matrix.target == 'macos'
        run: |
          brew install boost ninja

      - name: Install Windows Dependencies (Boost)
        if: matrix.target == 'windows'
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.83.0

      - name: Configure CMake (macOS)
        if: matrix.target == 'macos'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: matrix.target == 'windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBoost_ROOT="${{ steps.install-boost.outputs.BOOST_ROOT }}"
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}

      - name: Build C++ Binary
        run: |
          cmake --build build --config Release

      - name: Package macOS Binary
        if: matrix.target == 'macos'
        run: |
          mkdir -p package/Resources
          cp build/Beacon2_0 package/Beacon
          chmod +x package/Beacon
          echo "[]" > package/Resources/db.json
          cd package && zip -r ../${{ matrix.artifact-name }}.zip .

      - name: Package Windows Binary
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/resources | Out-Null
          if (Test-Path "build/Release/Beacon2_0.exe") {
            Copy-Item "build/Release/Beacon2_0.exe" "package/Beacon.exe"
          } elseif (Test-Path "build/Beacon2_0.exe") {
            Copy-Item "build/Beacon2_0.exe" "package/Beacon.exe"
          }
          Set-Content -Path "package/resources/db.json" -Value "[]"
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact-name }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          if-no-files-found: error

      - name: Publish Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
